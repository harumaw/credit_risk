# Автодеплой: каждый пуш (и мёрж PR) в main выкатывается на VPS.
# Копирует код на сервер в ~/credit-risk, пересобирает контейнеры
# и проверяет, что все они поднялись и сайт работает целиком: nginx → app → postgres.
#
# Секреты (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      VPS_DIR: credit-risk
      COMPOSE: docker compose -f docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "::error::Не заданы секреты VPS_HOST / VPS_USER / VPS_SSH_KEY"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' > ~/.ssh/config

      - name: Проверить сервер перед деплоем
        run: |
          ssh "$TARGET" "mkdir -p ~/$VPS_DIR"
          if ! ssh "$TARGET" "test -f ~/$VPS_DIR/.env"; then
            echo "::error::На сервере нет ~/$VPS_DIR/.env с POSTGRES_PASSWORD и JWT_SECRET"; exit 1
          fi
          ssh "$TARGET" "docker compose version"

      - name: Скопировать код на сервер
        run: |
          rsync -az Dockerfile .dockerignore docker-compose.prod.yml nginx.conf pyproject.toml poetry.lock alembic.ini \
            "$TARGET:$VPS_DIR/"
          # Папки синхронизируются с удалением лишнего. .env в корне не трогается.
          rsync -az --delete src migrations frontend "$TARGET:$VPS_DIR/"

      - name: Пересобрать и дождаться, пока все контейнеры станут healthy
        run: |
          # --wait: команда завершается, только когда postgres, app и nginx прошли свои healthcheck'и.
          # Если кто-то упал или не поднялся за 3 минуты, шаг падает.
          ssh "$TARGET" "cd ~/$VPS_DIR && $COMPOSE up -d --build --remove-orphans --wait --wait-timeout 180"

      - name: Проверить сайт по всей цепочке
        run: |
          # /health идёт через nginx в FastAPI, а тот делает SELECT 1 в базу
          ssh "$TARGET" "curl -fsS http://localhost/health"
          ssh "$TARGET" "curl -fsS -o /dev/null http://localhost/" && echo "Фронт отдаётся"

      - name: Состояние контейнеров
        if: always()
        run: ssh "$TARGET" "cd ~/$VPS_DIR && $COMPOSE ps" || true

      - name: Логи, если что-то упало
        if: failure()
        run: ssh "$TARGET" "cd ~/$VPS_DIR && $COMPOSE logs --tail=60 app postgres nginx" || true

      - name: Убрать старые образы
        if: success()
        run: ssh "$TARGET" "docker image prune -f"
