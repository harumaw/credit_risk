# Включить сайт на VPS без пересборки (поднимает то, что уже задеплоено).
# Запуск вручную: Actions → Server start → Run workflow.

name: Server start

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      VPS_DIR: credit-risk
      COMPOSE: docker compose -f docker-compose.prod.yml

    steps:
      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' > ~/.ssh/config

      - name: Запустить и дождаться healthy
        run: ssh "$TARGET" "cd ~/$VPS_DIR && $COMPOSE up -d --wait --wait-timeout 180"

      - name: Проверить сайт
        run: ssh "$TARGET" "curl -fsS http://localhost/health"

      - name: Состояние контейнеров
        if: always()
        run: ssh "$TARGET" "cd ~/$VPS_DIR && $COMPOSE ps" || true

      - name: Логи, если что-то упало
        if: failure()
        run: ssh "$TARGET" "cd ~/$VPS_DIR && $COMPOSE logs --tail=60 app postgres nginx" || true
