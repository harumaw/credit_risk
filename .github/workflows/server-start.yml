# Включить сайт на VPS без пересборки (поднимает то, что уже задеплоено).
# Запуск вручную: Actions → Server start → Run workflow.

name: Server start

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod # не пересекается с деплоем и остановкой
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      VPS_DIR: credit-risk

    steps:
      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' > ~/.ssh/config

      - name: Запустить контейнеры
        run: |
          ssh "$TARGET" "cd ~/$VPS_DIR && docker compose -f docker-compose.prod.yml up -d"

      - name: Проверить, что сайт отвечает
        run: |
          for i in $(seq 1 12); do
            if ssh "$TARGET" "curl -fsS -o /dev/null http://localhost/"; then
              echo "Сайт отвечает"; exit 0
            fi
            echo "Ждём запуска... ($i)"; sleep 5
          done
          echo "Сайт не поднялся, последние логи бэкенда:"
          ssh "$TARGET" "cd ~/$VPS_DIR && docker compose -f docker-compose.prod.yml logs --tail=80 app"
          exit 1
