[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend template"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "greenlet (>=3.5.4,<4.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4, <2.0.0)",
    "bcrypt (>=4.0.1,<4.1.0)",
    "pyjwt (>=2.10.0, <3.0.0)",
    "email-validator (>=2.0.0,<3.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "httpx (>=0.28.0,<1.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]  # app и simulator — пакеты из src (как PYTHONPATH в Dockerfile)

[tool.coverage.run]
source = ["src/app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-зависимости в значениях по умолчанию — штатный способ, не вызов при импорте
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
