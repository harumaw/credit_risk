services:
  app:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # ${VAR:?...}: если в .env нет переменной, compose сразу падает с понятной ошибкой
      POSTGRES_DSN: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан в .env}
    depends_on:
      postgres:
        condition: service_healthy # бэкенд стартует, только когда база готова
    healthcheck:
      # /health отвечает 200, только если приложение живо И достучалось до базы
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s # время на миграции при старте
    networks:
      - app-tier
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-tier
    restart: unless-stopped

  nginx:
    # Собирает React-фронт (frontend/Dockerfile) и отдаёт его вместе с прокси на app
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: в alpine localhost резолвится в IPv6, а nginx слушает IPv4
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-tier
    restart: unless-stopped

networks:
  app-tier:
    driver: bridge

volumes:
  postgres_data:
