services:
  app:
    build: .
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # ${VAR:?...}: если в .env нет переменной, compose сразу падает с понятной ошибкой
      POSTGRES_DSN: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан в .env}
      # Внешние источники — все в симуляторе; реальный сервис = другой URL
      EGRUL_URL: http://simulator:8100
      FNS_URL: http://simulator:8100
      RMSP_URL: http://simulator:8100
      FSSP_URL: http://simulator:8100
      EFRSB_URL: http://simulator:8100
      ZSK_URL: http://simulator:8100
      BKI_URL: http://simulator:8100
      ABS_URL: http://simulator:8100
    depends_on:
      postgres:
        condition: service_healthy # бэкенд стартует, только когда база готова
      simulator:
        condition: service_healthy
    healthcheck:
      # /health отвечает 200, только если приложение живо И достучалось до базы
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s # время на миграции при старте
    networks:
      - app-tier
    restart: unless-stopped

  worker:
    # Конвейер заявок: очередь tasks → сбор данных, стоп-факторы, скоринг, решение
    build: .
    command: python -m app.worker
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан в .env}
      EGRUL_URL: http://simulator:8100
      FNS_URL: http://simulator:8100
      RMSP_URL: http://simulator:8100
      FSSP_URL: http://simulator:8100
      EFRSB_URL: http://simulator:8100
      ZSK_URL: http://simulator:8100
      BKI_URL: http://simulator:8100
      ABS_URL: http://simulator:8100
    depends_on:
      app:
        condition: service_healthy # миграции уже применены
      simulator:
        condition: service_healthy
    healthcheck:
      # воркер пишет heartbeat-файл после каждого опроса очереди; старше 60 с — завис
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-tier
    restart: unless-stopped

  simulator:
    # Симулятор внешних источников — без БД и без публичного порта, только для app
    build: .
    command: uvicorn simulator.main:app --host 0.0.0.0 --port 8100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-tier
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-tier
    restart: unless-stopped

  nginx:
    # Собирает React-фронт (frontend/Dockerfile) и отдаёт его вместе с прокси на app
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: в alpine localhost резолвится в IPv6, а nginx слушает IPv4
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-tier
    restart: unless-stopped

networks:
  app-tier:
    driver: bridge

volumes:
  postgres_data:
