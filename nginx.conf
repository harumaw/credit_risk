server {

    listen 80;

    server_name _;



    root /usr/share/nginx/html;

    index index.html;



    location /auth/ {

        proxy_pass http://app:8000;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

    }



    # SSE статусов заявки: без буферизации и с долгим чтением, иначе события придут пачкой
    location ~ ^/applications/[^/]+/events$ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /applications {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /companies {

        proxy_pass http://app:8000;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

    }



    location = /health {

        proxy_pass http://app:8000;

        proxy_set_header Host $host;

    }



    # Файлы сборки Vite с хэшем в имени — можно кэшировать надолго

    location /assets/ {

        expires 1y;

        add_header Cache-Control "public, immutable";

    }



    # SPA: любые другие пути (/login, /register, /profile) отдают index.html

    location / {

        try_files $uri $uri/ /index.html;

    }

}

