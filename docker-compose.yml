services:
  app:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: local.env
        required: false # без local.env стенд тоже поднимается — с dev-значениями ниже
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:secret@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
    depends_on:
      - postgres
    networks:
      - app-tier

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5500:80"
    depends_on:
      - app
    networks:
      - app-tier

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge

volumes:
  postgres_data:
