services:
  app:
    build: .
    command: sh -c "alembic upgrade head && python -m app.seed && python -m app.dataload.synthetic --models-only && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: local.env
        required: false # без local.env стенд тоже поднимается — с dev-значениями ниже
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:secret@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      # суперпользователь /adminuser (только dev; в проде пароль — в .env на сервере)
      ADMIN_LOGIN: ${ADMIN_LOGIN:-ovv}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1234567890@}
      # Внешние источники — все в симуляторе; реальный сервис = другой URL
      EGRUL_URL: http://simulator:8100
      FNS_URL: http://simulator:8100
      RMSP_URL: http://simulator:8100
      FSSP_URL: http://simulator:8100
      EFRSB_URL: http://simulator:8100
      ZSK_URL: http://simulator:8100
      BKI_URL: http://simulator:8100
      ABS_URL: http://simulator:8100
    depends_on:
      postgres:
        condition: service_healthy # миграции — только когда база готова
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s # миграции, seed и загрузка моделей при старте
    networks:
      - app-tier

  worker:
    # Конвейер заявок: очередь tasks → сбор данных, стоп-факторы, скоринг, решение
    build: .
    command: python -m app.worker
    environment:
      POSTGRES_DSN: postgresql+asyncpg://app:secret@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      EGRUL_URL: http://simulator:8100
      FNS_URL: http://simulator:8100
      RMSP_URL: http://simulator:8100
      FSSP_URL: http://simulator:8100
      EFRSB_URL: http://simulator:8100
      ZSK_URL: http://simulator:8100
      BKI_URL: http://simulator:8100
      ABS_URL: http://simulator:8100
    healthcheck:
      # воркер пишет heartbeat-файл после каждого опроса очереди; старше 60 с — завис
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy # миграции уже применены — таблица tasks есть
      simulator:
        condition: service_healthy
    networks:
      - app-tier
    restart: unless-stopped

  simulator:
    # Симулятор ЕГРЮЛ/ФНС/ФССП/ЕФРСБ/ЗСК/БКИ/АБС — без БД, тот же образ, что у app
    build: .
    command: uvicorn simulator.main:app --host 0.0.0.0 --port 8100 --reload
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-tier

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5500:80"
    depends_on:
      - app
    networks:
      - app-tier

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge

volumes:
  postgres_data:
