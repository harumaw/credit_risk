repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/python-poetry/poetry
    rev: 1.8.5
    hooks:
      - id: poetry-check

  - repo: local
    hooks:
      - id: format
        name: format
        entry: ruff format .
        language: system
        pass_filenames: false
        types: [python]

      - id: lint
        name: lint
        entry: ruff check .
        language: system
        pass_filenames: false
        types: [python]
